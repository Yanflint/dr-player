<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dr-player — Stage 2 skeleton test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
      color: #222;
    }
    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin: 16px 0;
    }
    .status.ok { background: #d4edda; color: #155724; }
    .status.fail { background: #f8d7da; color: #721c24; }
    button {
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      margin-right: 8px;
    }
    button:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>dr-player — Stage 2 skeleton</h1>
  <p>Локальная тест-страница для проверки что Stage 2 skeleton собирается и инициализируется.
  Реальные load / mount / runtime появятся в Stages 3-6.</p>

  <div id="status" class="status">Ожидание загрузки bundle…</div>

  <h3>Действия</h3>
  <button id="btn-new">new DrPlayer.Player()</button>
  <button id="btn-load">player.load(stage2.dr.zip) — должно throw</button>
  <button id="btn-mount">player.mount(...) — должно throw</button>

  <h3>Console output</h3>
  <pre id="console"></pre>

  <script src="../dist/dr-player.min.js"></script>
  <script>
    const $status = document.getElementById('status');
    const $console = document.getElementById('console');

    function log(msg, kind) {
      const ts = new Date().toISOString().slice(11, 23);
      const line = `[${ts}] ${msg}\n`;
      $console.textContent += line;
      if (kind === 'error') console.error(msg);
      else console.log(msg);
    }

    function setStatus(text, kind) {
      $status.textContent = text;
      $status.className = `status ${kind}`;
    }

    if (typeof DrPlayer === 'undefined' || !DrPlayer.Player) {
      setStatus('FAIL: DrPlayer global или DrPlayer.Player не определены — bundle не загрузился.', 'fail');
      log('DrPlayer global отсутствует', 'error');
    } else {
      setStatus(`OK: bundle загружен. DrPlayer.VERSION = ${DrPlayer.VERSION}, STAGE_NUMBER = ${DrPlayer.STAGE_NUMBER}`, 'ok');
      log(`Bundle загружен. VERSION=${DrPlayer.VERSION}, STAGE=${DrPlayer.STAGE_NUMBER}`);
    }

    let player = null;

    document.getElementById('btn-new').addEventListener('click', () => {
      try {
        player = new DrPlayer.Player();
        log('new DrPlayer.Player() — OK (см. browser console для skeleton-сообщения)');
      } catch (err) {
        log(`Player constructor бросил: ${err.message}`, 'error');
      }
    });

    document.getElementById('btn-load').addEventListener('click', async () => {
      if (!player) {
        log('Сначала жми "new DrPlayer.Player()".', 'error');
        return;
      }
      try {
        await player.load('fixtures/stage2.dr.zip');
        log('player.load() resolved — НЕ ожидаемо в Stage 2!', 'error');
      } catch (err) {
        log(`player.load() ожидаемо бросил: ${err.message}`);
      }
    });

    document.getElementById('btn-mount').addEventListener('click', () => {
      if (!player) {
        log('Сначала жми "new DrPlayer.Player()".', 'error');
        return;
      }
      try {
        player.mount(document.body);
        log('player.mount() — НЕ ожидаемо в Stage 2!', 'error');
      } catch (err) {
        log(`player.mount() ожидаемо бросил: ${err.message}`);
      }
    });
  </script>
</body>
</html>
