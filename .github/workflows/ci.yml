name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Stage 3 эпика dr-player-v1 (2026-05-22) — validate-job + test-job.
# Полноценный bundle-build пока вне CI (требует cross-repo checkout
# Yanflint/deepreview, который приватный; default GITHUB_TOKEN не имеет
# доступа). Решение для Stage 5+ — либо открыть deepreview public, либо
# PAT в secrets. Текущий compromise: bundle верифицируется локально
# (`npm run build`), а CI подтверждает что lock-файл + npm install +
# vitest test-suite зелёные (Player.load logic покрывается полностью,
# без зависимости от deepreview repo).

jobs:
  validate:
    name: Validate structure + lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm install (dr-player)
        run: npm install
      - name: Check dr-runtime.lock present
        run: |
          if [ ! -f dr-runtime.lock ]; then
            echo "::error::dr-runtime.lock отсутствует. Запусти 'npm run dr-runtime-sync' локально и commit."
            exit 1
          fi
          echo "dr-runtime.lock OK:"
          cat dr-runtime.lock
      - name: Validate package.json structure
        run: |
          node -e "const p = require('./package.json'); if (!p.scripts.build || !p.scripts['dr-runtime-sync']) { console.error('package.json scripts отсутствуют'); process.exit(1); } console.log('package.json scripts OK:', Object.keys(p.scripts).join(', '));"

  test:
    name: vitest unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm install (dr-player)
        run: npm install
      - name: Run vitest
        run: npm test
